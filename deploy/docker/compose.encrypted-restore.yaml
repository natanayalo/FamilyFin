# Use a separate clean project. Preserve the source media and old data volume.
services:
  operations:
    volumes:
      - financial:/var/lib/familyfin
      - type: bind
        source: ${FAMILYFIN_ENCRYPTED_BACKUP_DIR:?Select mounted encrypted backup media}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
