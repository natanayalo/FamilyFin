# Opt-in production maintenance only. Verify media identity, encryption and ACLs
# with backup-encrypted.ps1 before invoking. Never fall back to a named volume.
services:
  operations:
    volumes:
      - financial:/var/lib/familyfin
      - type: bind
        source: ${FAMILYFIN_ENCRYPTED_BACKUP_DIR:?Select mounted encrypted backup media}
        target: /backups
        bind:
          create_host_path: false
