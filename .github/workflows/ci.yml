name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check src tests streamlit_app.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: deploy/docker/age-build/go.sum
      - name: Build locked recovery test tools
        working-directory: deploy/docker/age-build
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          go mod download all
          go mod verify
          mkdir -p "$RUNNER_TEMP/familyfin-age"
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/familyfin-age/age" filippo.io/age/cmd/age
          go build -mod=readonly -trimpath -buildvcs=false -o "$RUNNER_TEMP/familyfin-age/age-keygen" filippo.io/age/cmd/age-keygen
      - name: Tests
        env:
          FAMILYFIN_TEST_AGE_DIR: ${{ runner.temp }}/familyfin-age
        run: uv run pytest --cov=family_finance --cov-report=term-missing
      - name: Compile
        run: uv run python -m compileall -q src streamlit_app.py
      - name: Migration cycle
        run: |
          temp_dir="$(mktemp -d)"
          export FAMILY_FINANCE_DATABASE_URL="sqlite:///$temp_dir/migration.sqlite3"
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Diff whitespace
        run: git diff --check

  import-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --dev
      - name: Import capacity
        run: uv run python tests/capacity_import.py
