[project]
name = "family-finance"
version = "0.1.0"
description = "Local-first household finance import foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
family-finance = "family_finance.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

